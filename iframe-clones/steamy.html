<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Steamy Academy — Démo Yeekai</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    /*
      ⚠️ SCOPING CRITICAL :
      utiliser l'ID #site-background-iframe (pas le sélecteur `iframe` nu)
      pour ne PAS impacter l'iframe interne du panneau Yeekai (#yk-frame)
      qui s'ouvre au clic FAB. Cf bug détecté + fixé sur Xaadi (commit 22af8ece).
    */
    #site-background-iframe {
      position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0;
    }
  </style>
</head>
<body>
  <!--
    Approche "iframe wrapper" pour POC cold reach Steamy Academy.

    Steamy Academy = plateforme e-learning STEM (électronique, programmation,
    robotique, IA) développée par Tech It All Engineering and Services (TIA),
    société béninoise basée à Cotonou. Site hébergé sur learn.techitall.co.

    Site WordPress (o2switch) + TutorLMS + WooCommerce — donc REST API
    publiquement exposée. Si on veut un jour faire un Diaby-V3-like
    (sync_corpus + tools LangChain pour les 14+ cours du catalogue),
    le pattern WP+Woo est parfait. Différé V2.

    NB : il existe aussi un fichier techitall.html (créé en POC fallback
    précédent). Le slug Yeekai officiel pour ce tenant est maintenant
    'steamy', cohérent avec le nom de la plateforme et la marque.
    techitall.html peut être supprimé ou gardé en doublon selon préférence.
  -->
  <iframe
    id="site-background-iframe"
    src="https://www.learn.techitall.co"
    title="Steamy Academy — learn.techitall.co"
    allow="fullscreen; geolocation; camera; microphone"
  ></iframe>

  <!--
    ⚠️ HYPOTHÈSE UX SEAMLESS TESTÉE POUR STEAMY (mai 2026)
    ===================================================

    Steamy a déjà un Tawk.io en bas-DROITE pour le chat humain.
    Pour ne pas concurrencer mais COMPLÉTER ce canal, l'embed Yeekai :
    - Se positionne en bas-GAUCHE (data-fab-position="left")
    - Affiche une icône WhatsApp (data-fab-icon-style="whatsapp")
    - Click → ouvre une interface chat WhatsApp-like (?ui=whatsapp sur l'app)

    L'idée = se présenter comme "canal direct WhatsApp avec l'entreprise"
    plutôt que comme un n-ième bouton de chat générique.

    POUR DÉSACTIVER cette hypothèse et revenir au comportement standard Yeekai :
    - Retirer les 2 lignes data-fab-position + data-fab-icon-style
    - Retirer "?ui=whatsapp" du data-app-url
    Le FAB redeviendra droite + avatar + skin chat default.

    PRÉREQUIS PROD :
    - embed.js v1.1.0+ (sinon data-fab-* params ignorés silencieusement, FAB reste à droite avec avatar)
    - front IA SteamyApp avec détection ?ui=whatsapp (sinon iframe ouvre la skin default classique)
    -> Tant que les 2 ne sont pas live, dégradation gracieuse (l'iframe wrapper marche, juste sans le seamless visuel WA).
  -->
  <!-- Yeekai Embed -->
  <script
    src="https://yeekai-embed-js.vercel.app/v1/embed.js"
    data-tenant="steamy"
    data-app-url="https://yeekai-embed-ai-front.vercel.app/steamy?ui=whatsapp"
    data-disclaimer-target="https://www.learn.techitall.co"
    data-fab-position="left"
    data-fab-icon-style="whatsapp"
    async
  ></script>
  <!-- End Yeekai Embed -->
</body>
</html>
