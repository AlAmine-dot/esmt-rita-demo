<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>WeKanKode — Démo Yeekai</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    /*
      ⚠️ SCOPING CRITICAL :
      utiliser l'ID #site-background-iframe (pas le sélecteur `iframe` nu)
      pour ne PAS impacter l'iframe interne du panneau Yeekai (#yk-frame)
      qui s'ouvre au clic FAB. Cf bug détecté + fixé sur Xaadi (commit 22af8ece).
    */
    #site-background-iframe {
      position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0;
    }
  </style>
</head>
<body>
  <!--
    Approche "iframe wrapper" pour POC cold reach WeKanKode.
    Site servi via nginx/Ubuntu — pas d'indice particulier sur la tech
    côté serveur, on traitera le scraping à part si on veut creuser
    le POC plus tard.
  -->
  <iframe
    id="site-background-iframe"
    src="https://wekankode.com"
    title="wekankode.com"
    allow="fullscreen; geolocation; camera; microphone"
  ></iframe>

  <!-- Yeekai Embed -->
  <script
    src="https://yeekai-embed-js.vercel.app/v1/embed.js"
    data-tenant="wekankode"
    data-app-url="https://yeekai-embed-ai-front.vercel.app/wekankode"
    data-disclaimer-target="https://wekankode.com"
    async
  ></script>
  <!-- End Yeekai Embed -->
</body>
</html>
